<!DOCTYPE html>
<!--
  Comprehensive OSHC coverage (OSHC Compass)
  1. "Is it covered?"  - type a service, see if it is Included, Excluded, or only in Extras.
  2. The main benefits - hospital, doctor, medicine, ambulance, mental health, extra support.
  3. Extras plans      - pick a plan and see what it adds.
  4. Good to know      - who it is for, waiting periods, annual limits.

  All numbers and sentences come from the OSHC brochure PDF. Python (Coverage_Guide.py) reads the PDF
  and puts the data into the line "__PDF_DATA__" below. If the file is opened on its own, or a part is not
  found in the PDF, the saved copy (SAVED, further down) is used.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Guide</title>
<style>
  :root {
    --red: #C8322E; --red-soft: #FCEDEC; --navy: #1F3A5F; --ink: #1D2A3A; --muted: #5E6B7A;
    --line: #E3E6EA; --green: #1E8E4E; --green-soft: #E8F5EE; --blue: #2B5FA8; --blue-soft: #E9F0FA;
    --amber: #B7791F; --amber-soft: #FDF4E3; --grey-soft: #F1F4F8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
         font: 15px/1.5 "Source Sans Pro", "Source Sans 3", "Segoe UI", system-ui, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.2; color: var(--navy); }
  h3 { margin: 0 0 8px; font-size: 1.1rem; color: var(--navy); }
  section { margin: 0 0 26px; }
  .eyebrow { margin: 0; color: var(--red); font: 700 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .lead { margin: 4px 0 0; color: var(--ink); }
  .small { margin: 6px 0 0; font-size: .78rem; color: var(--muted); }
  .src { margin: 6px 0 0; font-size: .75rem; color: var(--muted); }

  .hero { background: var(--grey-soft); border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; }

  /* Search */
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; font: inherit; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; }
  .search input:focus { outline: none; border-color: var(--navy); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .chip { font: inherit; font-weight: 600; font-size: .85rem; padding: 4px 11px; border-radius: 99px; cursor: pointer;
          border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .chip:hover { border-color: var(--navy); }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip:focus-visible, .search input:focus-visible { outline: 3px solid #E07A1F; outline-offset: 2px; }

  .result { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; display: grid;
            grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
  .badge { font: 800 11px ui-monospace, Menlo, monospace; letter-spacing: .05em; text-transform: uppercase; padding: 4px 9px;
           border-radius: 99px; white-space: nowrap; align-self: start; margin-top: 2px; }
  .b-in    { background: var(--green-soft); color: var(--green); }
  .b-out   { background: var(--red-soft);   color: var(--red); }
  .b-extra { background: var(--blue-soft);  color: var(--blue); }
  .b-spec  { background: var(--amber-soft); color: var(--amber); }
  .result b.title { font-size: 1.02rem; color: var(--navy); }
  .result p { margin: 2px 0 0; grid-column: 2; }
  .result .note { color: var(--muted); font-size: .88rem; }
  .plans { grid-column: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 6px; }
  .plan { background: var(--grey-soft); border-radius: 8px; padding: 6px 9px; font-size: .85rem; }
  .plan b { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .none { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--amber-soft); }

  /* Tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .tile { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .tile .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--red-soft); margin-bottom: 4px; }
  .tile .ico svg { width: 22px; height: 22px; }
  .tile .big { font-size: 1.55rem; font-weight: 800; color: var(--red); line-height: 1.15; }
  .tile p { margin: 0; font-size: .92rem; }
  .tile .muted { color: var(--muted); font-size: .82rem; }

  /* Extras */
  .table-wrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--grey-soft); font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.no { color: var(--muted); }
  td.amt { font-weight: 700; white-space: nowrap; }


  /* Scenarios */
  .scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .sc { font: inherit; text-align: left; cursor: pointer; border: 1.5px solid var(--line); background: #fff; border-radius: 14px;
        padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
  .sc:hover { border-color: var(--navy); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(31,58,95,.12); }
  .sc[aria-pressed="true"] { border-color: var(--navy); background: var(--blue-soft); }
  .sc .em { font-size: 1.6rem; line-height: 1.2; }
  .sc b { color: var(--navy); font-size: .95rem; }
  .sc span.s { color: var(--muted); font-size: .8rem; }
  .sc:focus-visible { outline: 3px solid #E07A1F; outline-offset: 2px; }
  .story { margin-top: 12px; border: 1.5px solid var(--navy); border-radius: 14px; padding: 14px 16px; background: #fff; }
  .story[hidden] { display: none; }
  .story h4 { margin: 0 0 8px; color: var(--navy); font-size: 1.05rem; }
  .story ol { list-style: none; margin: 0; padding: 0; counter-reset: st; }
  .story li { display: grid; grid-template-columns: 30px 1fr; gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .story li:first-child { border-top: 0; }
  .story li::before { counter-increment: st; content: counter(st); width: 26px; height: 26px; border-radius: 50%; background: var(--navy);
                      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .story li .badge { display: inline-block; margin: 0 6px 0 0; }
  .story li p { margin: 0; }
  .story li .what { font-weight: 700; color: var(--navy); }

  ul.know { margin: 0; padding-left: 20px; }
  ul.know li { margin: 0 0 7px; }
  a { color: var(--navy); }
</style>
</head>

</section>

const STATUS = { in: ["b-in", "Covered"], extra: ["b-extra", "Extras only"], out: ["b-out", "Not covered"], spec: ["b-spec", "Part covered"] };
let openScen = -1;

function drawScenarios() {
  $("scen").innerHTML = SCENARIOS.map((s, i) =>
    `<button class="sc" data-i="${i}" aria-pressed="${i === openScen}"><span class="em" aria-hidden="true">${s.em}</span><b>${esc(s.title)}</b><span class="s">${esc(s.sub)}</span></button>`).join("");
  const box = $("story");
  if (openScen < 0) { box.hidden = true; return; }
  const s = SCENARIOS[openScen];
  box.hidden = false;
  box.innerHTML = `<h4>${esc(s.em + " " + s.title)}</h4><ol>` + s.steps().map(x => {
    const [cls, label] = STATUS[x.st];
    return `<li><div><p><span class="badge ${cls}">${label}</span><span class="what">${esc(x.what)}</span></p>` +
      `<p>${esc(x.text)}</p><p class="src">${esc(source(x.pg))}</p></div></li>`;
  }).join("") + "</ol>";
}
$("scen").addEventListener("click", e => {
  const b = e.target.closest(".sc"); if (!b) return;
  const i = +b.dataset.i; openScen = openScen === i ? -1 : i;
  drawScenarios(); resize();
});
